name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run security
      - run: node --check chrome/content/scripts/core.js
      - run: node --check chrome/content/scripts/scholarBridge.js
      - run: npm run build
      - run: npm run security
      - run: npm run validate
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-scholar-bridge-xpi
          path: dist/*.xpi
